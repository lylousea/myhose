<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="Sheepar 单文件本地演示版" />
  <title>Sheepar · 单文件演示版</title>
  <style>
:root {
  --cream: #fdfbf3;
  --cream-2: #f7f2df;
  --paper: #ffffff;
  --pear: #d7c85f;
  --pear-deep: #a89932;
  --pear-soft: #f4edbc;
  --sage: #b9cbb0;
  --sage-soft: #e9f0e5;
  --sage-deep: #5d775f;
  --ink: #393d35;
  --muted: #7c8176;
  --line: #ece7d8;
  --danger: #c46158;
  --danger-soft: #fbecea;
  --success: #4f8062;
  --shadow: 0 18px 50px rgba(91, 82, 44, 0.1);
  --soft-shadow: 0 8px 24px rgba(91, 82, 44, 0.07);
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--cream);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--cream); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 8% 2%, rgba(215, 200, 95, 0.18), transparent 28rem),
    radial-gradient(circle at 100% 28%, rgba(185, 203, 176, 0.24), transparent 30rem),
    var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:not(:disabled) { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.54; }
img { max-width: 100%; }
a { color: inherit; }
h1, h2, h3, p { margin-top: 0; }
p { line-height: 1.65; }

.app-shell { min-height: 100vh; }
.boot-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 16px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
}
.boot-logo { width: 96px; height: 96px; border-radius: 28px; object-fit: cover; box-shadow: var(--shadow); }
.boot-screen h1 { color: var(--ink); margin: 4px 0 0; }
.boot-screen p { margin: 0; }
.noscript-card { position: fixed; inset: 18px; z-index: 100; background: white; border-radius: 20px; padding: 24px; }
.toast-root { position: fixed; z-index: 200; left: 50%; top: 18px; display: grid; gap: 8px; width: min(92vw, 420px); transform: translateX(-50%); pointer-events: none; }
.toast {
  opacity: 0;
  transform: translateY(-8px);
  padding: 13px 16px;
  color: white;
  background: var(--success);
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(50, 70, 54, 0.25);
  font-size: 14px;
  line-height: 1.45;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast-error { background: var(--danger); }
.toast.is-visible { opacity: 1; transform: translateY(0); }

.button {
  appearance: none;
  border: 1px solid transparent;
  border-radius: 14px;
  min-height: 48px;
  padding: 12px 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.button:active:not(:disabled) { transform: scale(0.98); }
.button-primary {
  color: #fffef5;
  background: linear-gradient(135deg, #6e8b70, #4e6d56);
  box-shadow: 0 10px 24px rgba(78, 109, 86, 0.22);
}
.button-primary:hover { box-shadow: 0 14px 30px rgba(78, 109, 86, 0.28); }
.button-soft { background: #f7f5ea; color: var(--ink); border-color: var(--line); }
.button-soft:hover { background: #f0eddd; }
.button-danger { background: var(--danger-soft); color: var(--danger); border-color: #f1d3cf; }
.button-block { width: 100%; }
.button-small { min-height: 38px; border-radius: 11px; padding: 8px 14px; font-size: 13px; }
.button-tiny { min-height: 32px; border-radius: 10px; padding: 5px 11px; font-size: 12px; margin-left: 8px; }
.text-button { border: 0; background: none; color: var(--sage-deep); font-weight: 700; padding: 4px; }
.icon-button { border: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #f5f3e9; }
.icon-button.danger { color: var(--danger); background: var(--danger-soft); }
.inline-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.inline-actions.center { justify-content: center; }

.field { display: grid; gap: 8px; min-width: 0; }
.field > span { color: #5f655b; font-size: 13px; font-weight: 700; }
.field > small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fbfaf5;
  color: var(--ink);
  padding: 13px 14px;
  outline: none;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--sage);
  background: white;
  box-shadow: 0 0 0 4px rgba(185, 203, 176, 0.2);
}
.field textarea { resize: vertical; }
.field.compact { gap: 5px; }
.field.compact input, .field.compact select { padding: 10px 12px; border-radius: 11px; }
.stack-form { display: grid; gap: 16px; }
.inline-form { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
.form-grid { display: grid; gap: 14px; }
.inline-error { background: var(--danger-soft); color: var(--danger); border: 1px solid #f0ceca; border-radius: 12px; padding: 11px 13px; margin-bottom: 14px; font-size: 13px; }
.section-kicker { margin: 0 0 6px; color: var(--pear-deep); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
.eyebrow { font-size: 11px; letter-spacing: 0.18em; font-weight: 800; color: var(--sage-deep); }

.auth-page { min-height: 100vh; display: grid; }
.auth-brand { position: relative; overflow: hidden; padding: 34px 24px 28px; background: linear-gradient(155deg, #fffdf5 0%, #f6f0d8 55%, #e7efe2 100%); }
.auth-glow { position: absolute; border-radius: 999px; filter: blur(2px); opacity: 0.7; }
.auth-glow-one { width: 260px; height: 260px; right: -90px; top: -70px; background: rgba(215, 200, 95, 0.32); }
.auth-glow-two { width: 240px; height: 240px; left: -120px; bottom: 0; background: rgba(185, 203, 176, 0.4); }
.auth-brand-inner { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; text-align: center; }
.auth-logo-wrap { width: 150px; height: 150px; border-radius: 44px; background: rgba(255, 255, 255, 0.62); margin: 0 auto 24px; display: grid; place-items: center; box-shadow: 0 24px 50px rgba(99, 92, 52, 0.12); border: 1px solid rgba(255,255,255,0.8); }
.auth-logo { width: 126px; height: 126px; border-radius: 36px; object-fit: cover; }
.auth-brand h1 { margin: 12px 0 18px; font-size: clamp(30px, 7vw, 48px); line-height: 1.24; letter-spacing: -0.04em; font-weight: 800; }
.auth-desc { max-width: 520px; margin: 0 auto; color: #666b60; font-size: 15px; }
.auth-points { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.auth-points span { padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.86); color: #5f665b; font-size: 12px; font-weight: 700; }
.auth-panel { display: grid; align-items: center; padding: 24px 18px 44px; }
.auth-card { width: min(100%, 440px); margin: 0 auto; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.95); border-radius: 26px; box-shadow: var(--shadow); padding: 22px; backdrop-filter: blur(18px); }
.auth-card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.auth-card-head h2 { margin: 0; font-size: 25px; }
.auth-mini-logo { width: 50px; height: 50px; border-radius: 16px; object-fit: cover; border: 1px solid var(--line); }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 13px; background: #f3f0e4; margin-bottom: 18px; }
.auth-tabs button { border: 0; background: transparent; border-radius: 10px; padding: 10px; font-weight: 700; color: var(--muted); }
.auth-tabs button.active { background: white; color: var(--ink); box-shadow: var(--soft-shadow); }
.auth-divider { display: flex; align-items: center; gap: 12px; color: #9a9d91; font-size: 12px; margin: 18px 0; }
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.auth-note { color: var(--muted); font-size: 12px; text-align: center; margin: 13px 0 0; }
@media (min-width: 900px) {
  .auth-page { grid-template-columns: minmax(0, 1.15fr) minmax(430px, 0.85fr); }
  .auth-brand { min-height: 100vh; display: grid; align-items: center; padding: 48px; text-align: left; }
  .auth-brand-inner { text-align: left; }
  .auth-logo-wrap { margin-left: 0; }
  .auth-desc { margin-left: 0; }
  .auth-points { justify-content: flex-start; }
  .auth-panel { min-height: 100vh; padding: 48px; }
  .auth-card { padding: 28px; }
}
.app-header { position: sticky; top: 0; z-index: 30; background: rgba(253, 251, 243, 0.88); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(236, 231, 216, 0.86); }
.header-inner { min-height: 68px; max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; text-align: left; }
.brand-logo { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 5px 15px rgba(91,82,44,0.12); }
.brand-copy { display: grid; line-height: 1.15; }
.brand-copy strong { font-size: 17px; letter-spacing: -0.02em; }
.brand-copy small { color: var(--muted); font-size: 10px; margin-top: 4px; }
.desktop-nav { display: none; align-items: center; gap: 4px; }
.desktop-nav button { border: 0; background: transparent; padding: 10px 14px; border-radius: 11px; color: var(--muted); font-weight: 700; font-size: 13px; }
.desktop-nav button.active { color: var(--ink); background: #f2eedf; }
.account-pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.75); border-radius: 999px; padding: 8px 11px; max-width: 150px; font-size: 12px; font-weight: 700; }
.account-pill > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); flex: 0 0 auto; box-shadow: 0 0 0 4px rgba(79,128,98,0.12); }
.account-dot.guest { background: var(--pear-deep); box-shadow: 0 0 0 4px rgba(168,153,50,0.12); }
.page-content { max-width: 1240px; margin: 0 auto; padding: 20px 16px calc(92px + var(--safe-bottom)); }
.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin: 4px 0 20px; }
.page-heading h1 { margin: 0 0 7px; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; letter-spacing: -0.04em; }
.page-heading > div > p:last-child { margin: 0; color: var(--muted); font-size: 13px; }
.bottom-nav { position: fixed; z-index: 40; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 620px); display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 8px calc(7px + var(--safe-bottom)); background: rgba(255, 253, 247, 0.94); border: 1px solid rgba(236, 231, 216, 0.9); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(78, 70, 40, 0.08); backdrop-filter: blur(18px); }
.bottom-nav-item { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; font-size: 10px; color: var(--muted); min-height: 52px; }
.bottom-nav-icon { position: relative; font-size: 20px; line-height: 1; height: 24px; display: grid; place-items: center; }
.bottom-nav-icon b { position: absolute; right: -12px; top: -4px; min-width: 17px; height: 17px; border-radius: 999px; background: var(--pear-deep); color: white; font-size: 9px; display: grid; place-items: center; padding: 0 4px; }
.bottom-nav-item.active { color: var(--sage-deep); font-weight: 800; }
.section-block { margin-top: 24px; }
.section-heading-row, .settings-card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-heading-row h2, .settings-card-head h2 { margin: 0; font-size: 21px; }
.section-heading-row p:last-child, .settings-card-head p:last-child { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.result-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.shop-hero { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: var(--radius-xl); padding: 24px 20px; background: linear-gradient(135deg, #eef2df, #fbf5d8 58%, #f7e7be); border: 1px solid rgba(255,255,255,0.8); box-shadow: var(--soft-shadow); }
.shop-hero::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.38); right: -20px; top: -60px; }
.shop-hero-copy { position: relative; z-index: 1; max-width: 560px; }
.hero-badge { display: inline-flex; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.72); color: var(--sage-deep); font-size: 11px; font-weight: 800; }
.shop-hero h2 { margin: 12px 0 7px; font-size: clamp(22px, 5vw, 34px); letter-spacing: -0.03em; }
.shop-hero p { color: #63695e; margin: 0; font-size: 13px; }
.shop-hero-logo { width: 88px; height: 88px; border-radius: 28px; object-fit: cover; flex: 0 0 auto; border: 3px solid rgba(255,255,255,0.7); box-shadow: var(--soft-shadow); position: relative; z-index: 1; }
.shop-tools { margin: 18px 0 22px; display: grid; gap: 14px; }
.search-form { display: flex; align-items: center; gap: 7px; background: white; border: 1px solid var(--line); border-radius: 16px; padding: 5px 5px 5px 13px; box-shadow: var(--soft-shadow); }
.search-symbol { color: #9c9e91; font-size: 22px; }
.search-form input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 10px 2px; color: var(--ink); }
.search-form button { border: 0; border-radius: 11px; min-height: 40px; padding: 0 16px; background: var(--ink); color: white; font-weight: 700; font-size: 13px; }
.category-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 3px; scrollbar-width: none; }
.category-scroll::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,0.7); border-radius: 999px; padding: 9px 13px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip small { background: #efecdf; border-radius: 999px; padding: 1px 5px; font-size: 9px; }
.chip.active { color: white; background: var(--sage-deep); border-color: var(--sage-deep); }
.chip.active small { background: rgba(255,255,255,0.2); }
.sort-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; font-size: 11px; color: var(--muted); scrollbar-width: none; }
.sort-row::-webkit-scrollbar { display: none; }
.sort-row > span { flex: 0 0 auto; }
.text-chip { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); padding: 6px 8px; font-size: 11px; border-radius: 8px; }
.text-chip.active { color: var(--ink); background: var(--pear-soft); font-weight: 800; }
.product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.product-card { position: relative; min-width: 0; background: rgba(255,255,255,0.92); border: 1px solid rgba(236, 231, 216, 0.92); border-radius: 20px; padding: 12px; box-shadow: 0 7px 18px rgba(91,82,44,0.055); transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
.product-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(91,82,44,0.1); border-color: #ded7bf; }
.product-card-top { position: relative; display: block; }
.product-icon { display: grid; place-items: center; background: linear-gradient(145deg, #f4f1df, #e8efdf); border-radius: 17px; overflow: hidden; flex: 0 0 auto; }
.product-icon img { width: 100%; height: 100%; object-fit: cover; }
.product-card-icon { width: 100%; aspect-ratio: 1.35 / 1; font-size: 48px; margin-bottom: 11px; }
.stock-tag { position: absolute; right: 6px; top: 6px; z-index: 2; font-size: 9px; color: #6f7469; background: rgba(255,255,255,0.86); border: 1px solid rgba(236,231,216,0.8); border-radius: 999px; padding: 4px 7px; white-space: nowrap; backdrop-filter: blur(8px); }
.product-card-body { min-width: 0; }
.product-category { color: var(--sage-deep); font-size: 10px; font-weight: 800; letter-spacing: 0.04em; }
.product-card h3 { font-size: 15px; line-height: 1.35; margin: 6px 0; min-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-card-body p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3em; }
.product-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; gap: 6px; }
.price { color: var(--danger); font-weight: 800; font-size: 19px; letter-spacing: -0.03em; }
.price small { font-size: 11px; margin-right: 1px; }
.price span { color: var(--muted); font-size: 9px; font-weight: 400; letter-spacing: 0; }
.round-arrow { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--sage-soft); color: var(--sage-deep); font-size: 20px; line-height: 1; }
.load-more-wrap { display: flex; justify-content: center; margin-top: 22px; }
.trust-strip { margin-top: 26px; display: grid; grid-template-columns: 1fr; gap: 9px; padding: 16px; border-radius: 20px; background: rgba(233, 240, 229, 0.68); border: 1px solid rgba(185,203,176,0.45); }
.trust-strip > div { display: grid; grid-template-columns: 28px 1fr; column-gap: 8px; align-items: center; }
.trust-strip > div > span { grid-row: span 2; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: white; color: var(--sage-deep); font-weight: 800; }

.skeleton-card { min-height: 250px; }

.quantity-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.quantity-row > span { font-size: 13px; font-weight: 700; }
.stepper { display: inline-grid; grid-template-columns: 38px 54px 38px; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #faf8f0; }
.stepper button { height: 38px; border: 0; background: transparent; font-size: 18px; }
.stepper input { width: 54px; height: 38px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: white; text-align: center; outline: none; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper.small { grid-template-columns: 30px 42px 30px; }
.stepper.small button, .stepper.small input { height: 30px; }
.detail-total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; }
.detail-total strong { color: var(--danger); font-size: 24px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } }
.notice-banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 13px 16px; margin-bottom: 16px; background: #fff8dc; border: 1px solid #eee0a8; border-radius: 15px; font-size: 12px; color: #766a34; }
.notice-banner strong { color: #62571e; }
.cart-layout { display: grid; gap: 16px; }
.cart-list, .order-list, .admin-user-list, .admin-product-list { display: grid; gap: 12px; }
.cart-item { display: flex; gap: 12px; background: white; border: 1px solid var(--line); border-radius: 20px; padding: 13px; box-shadow: var(--soft-shadow); }
.cart-icon { width: 76px; height: 76px; border-radius: 18px; font-size: 38px; }
.cart-item-main { flex: 1; min-width: 0; display: grid; gap: 10px; }
.cart-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.cart-item-head h3 { margin: 0 0 4px; font-size: 15px; }
.cart-item-head span { color: var(--muted); font-size: 11px; }
.cart-item-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cart-item-foot strong { color: var(--danger); }
.checkout-card { background: white; border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--soft-shadow); align-self: start; }
.checkout-card h2 { margin: 0 0 15px; font-size: 21px; }
.checkout-line { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 15px; }
.checkout-line strong { color: var(--danger); font-size: 22px; }
.checkout-card .button { margin-top: 14px; }
.fine-print { color: var(--muted); font-size: 11px; margin: 10px 0 0; text-align: center; }
.order-card { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--soft-shadow); }
.order-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.order-card-head > div { display: grid; gap: 3px; }
.order-card-head small { color: var(--muted); font-size: 10px; }
.order-card-head strong { font-size: 12px; word-break: break-all; }
.status-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; font-size: 10px; font-weight: 800; white-space: nowrap; }
.status-paid { color: var(--success); background: var(--sage-soft); }
.status-pending { color: #8b741e; background: #faf0c9; }
.status-cancelled { color: var(--muted); background: #f1efe7; }
.order-items { padding: 10px 0; display: grid; gap: 7px; }
.order-item { display: grid; grid-template-columns: minmax(0, 1fr) 42px auto; gap: 8px; font-size: 12px; color: #60645b; }
.order-item > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-item strong { color: var(--ink); }
.order-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
.order-card-foot > div { display: flex; align-items: center; }
.order-card-foot strong { color: var(--danger); font-size: 18px; }
.guest-account-card, .profile-card { background: white; border: 1px solid var(--line); border-radius: 24px; padding: 20px; box-shadow: var(--soft-shadow); }
.guest-account-card { display: flex; gap: 16px; align-items: center; }
.guest-avatar, .profile-avatar { width: 78px; height: 78px; border-radius: 24px; object-fit: cover; flex: 0 0 auto; border: 2px solid white; box-shadow: var(--soft-shadow); }
.guest-account-card h2 { margin: 8px 0 5px; }
.guest-account-card p { margin: 0; color: var(--muted); font-size: 12px; }
.profile-card { display: grid; gap: 18px; background: linear-gradient(135deg, #fffef9, #f4f1df 65%, #e9f0e5); }
.profile-main { display: flex; align-items: center; gap: 15px; }
.profile-main h2 { margin: 8px 0 4px; font-size: 24px; }
.profile-main p { margin: 0; color: var(--muted); font-size: 11px; }
.profile-balance { background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.9); border-radius: 18px; padding: 15px; display: grid; gap: 3px; }
.profile-balance > span, .profile-balance > small { color: var(--muted); font-size: 11px; }
.profile-balance > strong { font-size: 32px; color: var(--danger); }
.profile-balance > strong small { font-size: 14px; margin-right: 2px; }
.level-badge { display: inline-flex; border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 800; color: #665f43; background: #f0ecd9; }
.level-0 { color: #777; background: #efeee9; }
.level-1 { color: #537181; background: #e7f0f3; }
.level-2 { color: #98701c; background: #fbf0ca; }
.level-3 { color: #6f6b5f; background: #eeeae0; }
.level-4 { color: #6a4f91; background: #eee6f7; }
.quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.quick-stats button { border: 1px solid var(--line); background: white; border-radius: 17px; padding: 14px 8px; display: grid; gap: 5px; box-shadow: var(--soft-shadow); }
.quick-stats span { color: var(--muted); font-size: 10px; }
.quick-stats strong { font-size: 17px; }
.menu-list { background: white; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--soft-shadow); }
.menu-list button { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 16px; display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 13px; }
.menu-list button:last-child { border-bottom: 0; }
.menu-list b { color: #b0b1a7; font-size: 20px; font-weight: 400; }
.danger-text { color: var(--danger); }
.settings-card, .admin-panel-card { background: white; border: 1px solid var(--line); border-radius: 21px; padding: 18px; box-shadow: var(--soft-shadow); margin-bottom: 14px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.settings-row:first-child { padding-top: 0; }
.settings-row:last-child { padding-bottom: 0; border-bottom: 0; }
.settings-row > div { display: grid; gap: 4px; }
.settings-row strong { font-size: 13px; }
.settings-row span { color: var(--muted); font-size: 11px; }
.settings-row > strong { color: var(--danger); font-size: 18px; }
.admin-entry-card { background: linear-gradient(135deg, #fffdf5, #f1f4e8); border-color: #e4e5cf; }
.admin-entry-card > p { color: var(--muted); font-size: 12px; margin: 13px 0 0; }
.muted-card { background: #f8f6ef; }
.muted-card p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.admin-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 3px 0 18px; }
.admin-heading h1 { margin: 0 0 5px; font-size: clamp(27px, 5vw, 38px); letter-spacing: -0.04em; }
.admin-heading p:last-child { margin: 0; color: var(--muted); font-size: 12px; }
.admin-tabs { display: flex; gap: 5px; padding: 5px; background: #efecdf; border-radius: 14px; margin-bottom: 16px; overflow-x: auto; }
.admin-tabs button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px; color: var(--muted); font-weight: 700; font-size: 12px; white-space: nowrap; }
.admin-tabs button.active { background: white; color: var(--ink); box-shadow: var(--soft-shadow); }
.metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.metric-card { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 15px; display: grid; gap: 5px; box-shadow: var(--soft-shadow); }
.metric-card span, .metric-card small { color: var(--muted); font-size: 10px; }
.metric-card strong { font-size: 27px; letter-spacing: -0.04em; }
.metric-card.accent { background: linear-gradient(135deg, #f9f2c5, #eef3e3); }
.compact-list { display: grid; gap: 8px; }
.compact-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.compact-row:last-child { border-bottom: 0; }
.admin-product-card { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: #fffefa; }
.admin-product-icon { width: 74px; height: 74px; border-radius: 18px; font-size: 36px; }
.admin-product-main { flex: 1; min-width: 0; }
.admin-product-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.admin-product-title span:first-child { color: var(--sage-deep); font-size: 10px; font-weight: 800; }
.admin-product-title h3 { margin: 4px 0 8px; font-size: 15px; }
.admin-product-meta { display: flex; flex-wrap: wrap; gap: 7px 12px; align-items: center; color: var(--muted); font-size: 10px; margin-bottom: 10px; }
.admin-product-meta strong { color: var(--danger); font-size: 16px; }
.admin-user-card { border: 1px solid var(--line); border-radius: 18px; padding: 15px; background: #fffefa; }
.admin-user-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
.admin-user-head h3 { margin: 0 0 4px; font-size: 15px; }
.admin-user-head span { color: var(--muted); font-size: 10px; }
.member-form { display: grid; gap: 10px; }
.member-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.success-panel { text-align: center; padding-top: 12px; }
.success-icon { width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--sage-soft); color: var(--success); font-size: 30px; font-weight: 800; }
.success-panel h2 { margin: 0 0 8px; }
.success-panel > p { color: var(--muted); font-size: 13px; }
.receipt-line { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; text-align: left; }
.receipt-line strong { word-break: break-all; text-align: right; }
.product-form { gap: 14px; }
.product-icon-preview { display: flex; justify-content: center; margin: 4px 0 10px; }
.editor-icon { width: 94px; height: 94px; border-radius: 26px; font-size: 48px; }
.file-field input { padding: 10px; background: #f8f6ee; font-size: 12px; }

@media (min-width: 560px) {
  .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .product-card { padding: 14px; }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inline-form { grid-template-columns: 1fr auto; align-items: end; }
  .inline-form .button { min-height: 44px; }
  .metric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cart-layout { grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.7fr); align-items: start; }
  .checkout-card { position: sticky; top: 86px; }
  .trust-strip { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 760px) {
  .header-inner { padding: 12px 24px; min-height: 76px; }
  .desktop-nav { display: flex; }
  .page-content { padding: 28px 24px 40px; }
  .bottom-nav { display: none; }
  .shop-hero { padding: 30px 32px; }
  .shop-hero-logo { width: 120px; height: 120px; border-radius: 34px; }
  .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .product-card-icon { font-size: 58px; }
  .modal-backdrop { align-items: center; padding: 24px; }
  .modal { border-radius: 26px; padding: 28px; max-height: 88vh; }
  .modal-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .profile-card { grid-template-columns: 1fr auto; align-items: center; }
  .profile-balance { min-width: 220px; }
  .admin-product-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .admin-user-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .admin-user-card .member-form { grid-template-columns: 1fr 1fr; align-items: end; }
  .member-actions { grid-column: 1 / -1; }
}
@media (min-width: 1080px) {
  .page-content { padding-left: 32px; padding-right: 32px; }
  .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .product-card-body p { font-size: 11px; }
  .admin-product-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 390px) {
  .brand-copy small { display: none; }
  .account-pill { max-width: 125px; }
  .page-heading h1 { font-size: 26px; }
  .product-grid { gap: 9px; }
  .product-card { border-radius: 17px; padding: 10px; }
  .product-card h3 { font-size: 14px; }
  .product-card-icon { font-size: 42px; border-radius: 14px; }
  .stock-tag { font-size: 8px; padding: 3px 5px; }
  .shop-hero { padding: 20px 16px; }
  .shop-hero-logo { width: 70px; height: 70px; }
  .modal { padding-left: 15px; padding-right: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
}

  position: fixed;
  z-index: 300;
  top: 78px;
  left: 50%;
  transform: translateX(-50%) translateY(0);

  background: rgba(57, 61, 53, 0.92);
  color: #fffdf5;
  font-size: 11px;
  box-shadow: 0 10px 30px rgba(40, 40, 30, 0.2);
  white-space: nowrap;
  opacity: 1;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

class ApiError extends Error {
  constructor(message, code = "REQUEST_FAILED", status = 500) {
    super(message);
    this.name = "ApiError";
    this.code = code;
    this.status = status;
  }
}

function normalizeRoute(hash) {
  const value = String(hash || "#/shop");
  return value.startsWith("#/") ? value : "#/shop";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMoney(cents) {
  return (Number(cents || 0) / 100).toFixed(2);
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return new Intl.DateTimeFormat("zh-CN", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).format(date);
}

function loadCart() {
  try {
    const parsed = JSON.parse(localStorage.getItem("sheepar_cart") || "[]");
    if (!Array.isArray(parsed)) return [];
    return parsed
      .filter((item) => Number.isInteger(Number(item.productId)) && Number(item.quantity) > 0)
      .map((item) => ({
        productId: Number(item.productId),
        quantity: Math.min(9999, Number(item.quantity)),
        name: String(item.name || "商品"),
        priceCents: Number(item.priceCents || 0),
        iconUrl: String(item.iconUrl || ""),
        iconEmoji: String(item.iconEmoji || "🌱"),
        stock: Number(item.stock || 0),
      }));
  } catch {
    return [];
  }
}

function saveCart() {
  localStorage.setItem("sheepar_cart", JSON.stringify(state.cart));
}

function cartCount() {
  return state.cart.reduce((sum, item) => sum + Number(item.quantity), 0);
}

function cartTotal() {
  return state.cart.reduce((sum, item) => sum + Number(item.priceCents) * Number(item.quantity), 0);
}

function showToast(message, type = "success") {
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  toastRoot.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("is-visible"));
  setTimeout(() => {
    toast.classList.remove("is-visible");
    setTimeout(() => toast.remove(), 220);
  }, 2800);

async function loadShop(options = {}) {
  if (state.shop.loading) return;
  const key = currentShopKey();
  if (!options.append && state.shop.key === key) return;
  const page = options.append ? state.shop.page + 1 : 1;
  state.shop.loading = true;
  render();
  try {
    const params = new URLSearchParams({
      page: String(page),
      limit: "12",
      sort: state.shop.sort,
    });
    if (state.shop.query) params.set("q", state.shop.query);
    if (state.shop.category) params.set("category", state.shop.category);
    const data = await api(`/api/products?${params.toString()}`);
    state.shop.items = options.append ? [...state.shop.items, ...data.items] : data.items;
    state.shop.total = data.total;
    state.shop.page = data.page;
    state.shop.totalPages = data.totalPages;
    state.shop.key = key;
  } catch (error) {
    if (error.status === 401) {
      state.session = { authenticated: false };
    } else {
      showToast(error.message, "error");
    }
  } finally {
    state.shop.loading = false;
    render();
  }
}

function addToCart(product, quantity = 1) {
  const existing = state.cart.find((item) => item.productId === Number(product.id));
  const nextQuantity = Math.min(9999, (existing?.quantity || 0) + quantity);
  if (existing) {
    existing.quantity = nextQuantity;
    existing.priceCents = product.priceCents;
    existing.stock = product.stock;
    existing.iconUrl = product.iconUrl;
    existing.iconEmoji = product.iconEmoji;
  } else {
    state.cart.push({
      productId: Number(product.id),
      quantity,
      name: product.name,
      priceCents: product.priceCents,
      iconUrl: product.iconUrl,
      iconEmoji: product.iconEmoji,
      stock: product.stock,
    });
  }
  saveCart();
  showToast("已加入购物车");
  render();
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function render() {
  if (!state.ready) return;
  state.route = normalizeRoute(location.hash);
  if (!isLoggedIn()) {
    renderAuth();
    return;
  }
  const allowed = new Set(["#/shop", "#/cart", "#/orders", "#/me", "#/settings", "#/admin"]);
  if (!allowed.has(state.route)) {
    state.route = "#/shop";
    history.replaceState(null, "", "#/shop");
  }
  if (state.route === "#/shop") renderShopPage();
  else if (state.route === "#/cart") renderCartPage();
  else if (state.route === "#/orders") renderOrdersPage();
  else if (state.route === "#/me") renderMePage();
  else if (state.route === "#/settings") renderSettingsPage();
  else if (state.route === "#/admin") renderAdminPage();

  if (state.route === "#/shop" && !state.shop.loading && state.shop.key !== currentShopKey()) {
    queueMicrotask(() => loadShop());
  }
  if (state.route === "#/orders" && !state.session?.guest && !state.orders.loaded && !state.orders.loading) {
    queueMicrotask(() => loadOrders());
  }
  if (state.route === "#/admin" && state.session?.adminUnlocked && !state.admin.loaded && !state.admin.loading) {
    queueMicrotask(() => loadAdminData());
  }
}

async function handleClick(event) {
  const trigger = event.target.closest("[data-action]");
  if (!trigger) return;
  const action = trigger.dataset.action;
  if (action === "close-modal") {
    if (event.target === trigger || trigger.tagName === "BUTTON") closeModal();
    return;
  }
  if (action === "reload-page") return location.reload();
  if (action === "navigate") return setRoute(trigger.dataset.route);
  if (action === "auth-mode") { state.authMode = trigger.dataset.mode; state.authError = ""; return renderAuth(); }
  if (action === "guest-login") return handleGuestLogin();
  if (action === "logout") return handleLogout();
  if (action === "go-auth") return openAuth(trigger.dataset.mode || "login");
  if (action === "open-product") return openProductDetail(Number(trigger.dataset.id));
  if (action === "detail-qty") {
    const input = document.querySelector("#detail-quantity");
    const max = Math.max(1, Math.min(9999, Number(window.currentProduct?.stock || 1)));
    const next = Math.max(1, Math.min(max, (Number(input.value) || 1) + Number(trigger.dataset.step)));
    input.value = String(next);
    input.dispatchEvent(new Event("input"));
    return;
  }
  if (action === "add-detail-cart") {
    const input = document.querySelector("#detail-quantity");
    const quantity = Math.max(1, Number(input?.value || 1));
    if (!window.currentProduct) return;
    addToCart(window.currentProduct, quantity);
    closeModal();
    return;
  }
  if (action === "buy-detail-now") {
    const input = document.querySelector("#detail-quantity");
    const quantity = Math.max(1, Number(input?.value || 1));
    if (!window.currentProduct) return;
    return submitOrder([{ productId: window.currentProduct.id, quantity }], "立即购买");
  }
  if (action === "filter-category") {
    state.shop.category = trigger.dataset.category || "";
    state.shop.page = 1;
    state.shop.items = [];
    state.shop.key = "";
    return loadShop();
  }
  if (action === "sort-products") {
    state.shop.sort = trigger.dataset.sort;
    state.shop.page = 1;
    state.shop.items = [];
    state.shop.key = "";
    return loadShop();
  }
  if (action === "load-more-products") return loadShop({ append: true });
  if (action === "cart-qty") {
    const id = Number(trigger.dataset.id);
    const item = state.cart.find((entry) => entry.productId === id);
    if (!item) return;
    item.quantity = Math.max(0, item.quantity + Number(trigger.dataset.step));
    if (item.quantity === 0) state.cart = state.cart.filter((entry) => entry.productId !== id);
    saveCart();
    return render();
  }
  if (action === "remove-cart") {
    state.cart = state.cart.filter((entry) => entry.productId !== Number(trigger.dataset.id));
    saveCart();
    return render();
  }
  if (action === "close-modal-and-orders") { closeModal(); return setRoute("#/orders"); }
  if (action === "pay-order") {
    trigger.disabled = true;
    try {
      const data = await api(`/api/orders/${Number(trigger.dataset.id)}/pay`, { method: "POST", body: {} });
      state.orders.loaded = false;
      state.session.user.balanceCents = data.balanceCents;
      showToast(data.message);
      return loadOrders();
    } catch (error) {
      trigger.disabled = false;
      return showToast(error.message, "error");
    }
  }
  if (action === "open-password-modal") return openPasswordModal();
  if (action === "lock-admin") {
    try { await api("/api/admin/lock", { method: "POST", body: {} }); } catch {}
    state.session.adminUnlocked = false;
    state.admin.loaded = false;
    setRoute("#/settings");
    showToast("管理员后台已锁定");
    return;
  }
  if (action === "admin-tab") {
    state.admin.tab = trigger.dataset.tab;
    return render();
  }
  if (action === "new-product") return openProductEditor();
  if (action === "edit-product") {
    const product = state.admin.products.find((item) => item.id === Number(trigger.dataset.id));
    if (product) openProductEditor(product);
    return;
  }
  if (action === "toggle-user-block") {
    const id = Number(trigger.dataset.id);
    const currentStatus = trigger.dataset.status;
    const nextStatus = currentStatus === "active" ? "blocked" : "active";
    if (nextStatus === "blocked" && !window.confirm("确认拉黑该客户？拉黑后对方会立即退出登录。")) return;
    trigger.disabled = true;
    try {
      await api(`/api/admin/users/${id}`, { method: "PATCH", body: { status: nextStatus } });
      state.admin.loaded = false;
      showToast(nextStatus === "blocked" ? "客户已拉黑" : "客户已恢复正常");
      return loadAdminData();
    } catch (error) {
      trigger.disabled = false;
      return showToast(error.message, "error");
    }
  }
}

document.addEventListener("click", (event) => {
  handleClick(event).catch((error) => {
    console.error(error);
    showToast(error.message || "操作失败", "error");
  });
});
document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;

  if (form.id === "auth-form") {
    event.preventDefault();
    if (state.authBusy) return;
    const data = new FormData(form);
    const username = String(data.get("username") || "").trim();
    const password = String(data.get("password") || "");
    const confirmPassword = String(data.get("confirmPassword") || "");
    if (state.authMode === "register" && password !== confirmPassword) {
      state.authError = "两次输入的密码不一致";
      return renderAuth();
    }
    state.authBusy = true;
    state.authError = "";
    renderAuth();
    try {
      const response = await api(state.authMode === "login" ? "/api/auth/login" : "/api/auth/register", {
        method: "POST",
        body: { username, password },
      });
      state.session = response;
      state.authBusy = false;
      resetPrivateData();
      setRoute("#/shop");
      showToast(response.message || "登录成功");
    } catch (error) {
      state.authBusy = false;
      state.authError = error.message;
      renderAuth();
    }
    return;
  }

  if (form.id === "search-form") {
    event.preventDefault();
    const data = new FormData(form);
    state.shop.query = String(data.get("query") || "").trim();
    state.shop.page = 1;
    state.shop.items = [];
    state.shop.key = "";
    loadShop();
    return;
  }

  if (form.id === "checkout-form") {
    event.preventDefault();
    if (!state.cart.length) return;
    const note = String(document.querySelector("#order-note")?.value || "").trim();
    const button = form.querySelector("button[type=submit]");
    if (button) button.disabled = true;
    await submitOrder(state.cart.map((item) => ({ productId: item.productId, quantity: item.quantity })), note);
    if (button && document.body.contains(button)) button.disabled = false;
    return;
  }

  if (form.id === "admin-unlock-form") {
    event.preventDefault();
    const button = form.querySelector("button[type=submit]");
    const password = String(new FormData(form).get("password") || "");
    button.disabled = true;
    try {
      await api("/api/admin/unlock", { method: "POST", body: { password } });
      state.session.adminUnlocked = true;
      state.admin.loaded = false;
      setRoute("#/admin");
      showToast("管理员后台已解锁");
    } catch (error) {
      button.disabled = false;
      showToast(error.message, "error");
    }
    return;
  }

  if (form.id === "change-password-form") {
    event.preventDefault();
    const data = new FormData(form);
    const currentPassword = String(data.get("currentPassword") || "");
    const newPassword = String(data.get("newPassword") || "");
    const confirmPassword = String(data.get("confirmPassword") || "");
    if (newPassword !== confirmPassword) return showToast("两次输入的新密码不一致", "error");
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      await api("/api/auth/change-password", { method: "POST", body: { currentPassword, newPassword } });
      closeModal();
      showToast("密码已更新");
    } catch (error) {
      button.disabled = false;
      showToast(error.message, "error");
    }
    return;
  }

  if (form.id === "product-form") {
    event.preventDefault();
    const data = new FormData(form);
    const productId = form.dataset.id ? Number(form.dataset.id) : null;
    const file = data.get("iconFile");
    if (file instanceof File && file.size > 0 && file.size > 2 * 1024 * 1024) {
      return showToast("图标图片不能超过 2MB", "error");
    }
    const body = {
      name: String(data.get("name") || ""),
      category: String(data.get("category") || ""),
      description: String(data.get("description") || ""),
      priceYuan: String(data.get("priceYuan") || "0"),
      stock: Number(data.get("stock") || 0),
      status: String(data.get("status") || "active"),
      iconEmoji: String(data.get("iconEmoji") || "🌱"),
      iconUrl: String(data.get("iconUrl") || ""),
    };
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      const saved = await api(productId ? `/api/admin/products/${productId}` : "/api/admin/products", {
        method: productId ? "PATCH" : "POST",
        body,
      });
      if (file instanceof File && file.size > 0) {
        const dataUrl = await fileToDataUrl(file);
        await api(`/api/admin/products/${saved.product.id}/icon`, { method: "POST", body: { dataUrl } });
      }
      closeModal();
      state.admin.loaded = false;
      showToast(productId ? "商品已更新" : "商品已创建");
      await loadAdminData();
    } catch (error) {
      button.disabled = false;
      showToast(error.message, "error");
    }
    return;
  }

  if (form.classList.contains("member-form")) {
    event.preventDefault();
    const userId = Number(form.dataset.id);
    const data = new FormData(form);
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      await api(`/api/admin/users/${userId}`, {
        method: "PATCH",
        body: {
          level: String(data.get("level") || ""),
          balanceYuan: String(data.get("balanceYuan") || "0"),
        },
      });
      state.admin.loaded = false;
      showToast("客户资料已更新");
      await loadAdminData();
    } catch (error) {
      button.disabled = false;
      showToast(error.message, "error");
    }
  }
});

window.addEventListener("hashchange", () => {
  state.route = normalizeRoute(location.hash);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modalRoot.innerHTML) closeModal();
});

boot();

setTimeout(() => {
  const notice = document.createElement("div");
  notice.className = "demo-notice";
  notice.textContent = "本地演示版 · 数据只保存在当前浏览器";
  document.body.appendChild(notice);
  setTimeout(() => notice.classList.add("is-hidden"), 5000);
  setTimeout(() => notice.remove(), 5600);
}, 700);

  </script>
